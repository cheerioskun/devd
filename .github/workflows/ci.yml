name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          
      - name: Build
        run: go build ./cmd/devd
        
      - name: Vet
        run: go vet ./...
        
      - name: Test
        run: go test ./...
