version: "2"

formatters:
  enable:
    - gofmt

linters:
  enable:
    - errcheck
    - govet
  settings:
    errcheck:
      exclude-functions:
        # Deferred close — error is meaningless in defer
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (net.Conn).Close
        - (net.Listener).Close
        - (io.Closer).Close

        # Writing to stdout/stderr
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - (*text/tabwriter.Writer).Flush

        # Fire-and-forget / cleanup
        - (*os/exec.Cmd).Wait
        - (*os.Process).Signal
        - io.Copy

        # cobra flag registration — panics on bad input
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
